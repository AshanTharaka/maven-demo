
name: Spring Boot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run Maven tests
        run: mvn --batch-mode clean verify

      - name: Build Docker image
        run: docker build -t maven-demo:${{ github.sha }} .

        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag maven-demo:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest
          docker tag maven-demo:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ github.sha }}

