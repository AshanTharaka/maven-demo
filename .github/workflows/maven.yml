name: Maven + Docker CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 11
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Build + run tests
      - name: Build with Maven
        run: mvn clean package

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker image with latest + commit SHA
      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ github.sha }} .

      # 6. Push latest + commit SHA images
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ github.sha }}

      # 7. Get release version from Git tag
      - name: Get release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # 8. Build release Docker image
      - name: Build release Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ env.VERSION }} .

      # 9. Push release Docker image
      - name: Push release Docker image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/maven-demo:${{ env.VERSION }}